name: "CI (lint + unit)"

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: "lint + unit / node22 / ubuntu"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (tsc --noEmit)
        run: npm run lint

      - name: Unit tests
        run: npm test
