name: "CI (lint + unit + component + e2e)"

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: "lint + unit / node22 / ubuntu"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Complexity lint
        run: npm run complexity

      - name: Python parity tests
        run: npm run test:py

      - name: Lint (tsc --noEmit)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=moderate

  # The component lane (Vitest + jsdom + RTL): src/**/*.test.tsx React component tests. No
  # browser/Playwright install needed — jsdom runs headless in Node. Disjoint from the node:test
  # glob (tests/*.ts), so the two runners never collide.
  component:
    name: "component / node22 / ubuntu"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Component tests (Vitest + RTL)
        run: npm run test:component

  # The mock lane (?mock=1 harness, Vite only — no backend): every orbital_*.spec.ts UI flow.
  # Green here proves the client wiring, not the server — the live lane below covers the wire.
  e2e-mock:
    name: "e2e mock lane / chromium / ubuntu"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright (mock lane)
        run: npm run test:e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mock-traces
          path: test-results/
          retention-days: 7

  # Python daemon smoke / Windows: boots the REAL interpreter on windows-latest and exercises the
  # stdio NDJSON round-trip end-to-end. Exit 0 = pass, exit 1 = FAIL (interpreter present but
  # daemon broken — job fails), exit 2 = SKIP (no interpreter at all — job passes). The PowerShell
  # step inspects $LASTEXITCODE explicitly so exit-2 is not misread as failure.
  python-smoke-windows:
    name: "python smoke / windows-latest"
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set up Python 3.12
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python daemon smoke (exit 1 = FAIL, exit 2 = SKIP)
        shell: pwsh
        env:
          # Pin the interpreter to the EXACT python setup-python installed. Without this, discovery
          # tries the Windows `py -3` launcher first (registry scan + may resolve to a different
          # interpreter), and on a cold runner the first spawn of every candidate can blow the ping
          # deadline before Defender finishes scanning the new process image. JANUS_PYTHON collapses
          # discovery to one known-good, on-PATH candidate (src/memory/pythonClient.ts
          # discoverPythonInterpreter), so the smoke spends its whole window on the right interpreter.
          JANUS_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          Write-Output "[smoke:daemon] JANUS_PYTHON=$env:JANUS_PYTHON"
          npm run smoke:daemon
          $code = $LASTEXITCODE
          if ($code -eq 2) {
            Write-Output "[smoke:daemon] exit 2 — no Python interpreter found, treating as SKIP (job passes)"
            exit 0
          }
          exit $code

  # The live lane (PW_LIVE=1): the REAL `tsx server.ts` on a fresh temp JANUS_DB — pane
  # creation through the capability gate, stop-all, drafts, real PTY spawns. No Gemini key
  # needed (the lane never opens a voice session). Serial specs, generous timeouts.
  e2e-live:
    name: "e2e live lane / chromium / ubuntu"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright (live lane)
        run: npm run test:e2e:live

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-live-traces
          path: test-results/
          retention-days: 7
